[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/synth", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
proptest = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = "0.62"
rayon = "1.12"
