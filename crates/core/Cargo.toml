[package]
name = "disk-analyst-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "disk_analyst_core"

[dependencies]
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
disk-analyst-synth = { path = "../synth" }

[[bench]]
name = "baseline"
harness = false
